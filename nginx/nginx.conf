server {
    listen 80;
    server_name rgau-schedule.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name rgau-schedule.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/rgau-schedule.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rgau-schedule.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

