server {
    listen 443 ssl;
    server_name egorfrolov.ru;

    ssl_certificate /etc/letsencrypt/live/egorfrolov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/egorfrolov.ru/privkey.pem;

    location / {
        proxy_pass http://portfolio:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name www.egorfrolov.ru;

